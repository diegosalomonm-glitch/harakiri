<body>
<p>Abriendo entradas&hellip;<br><a id="l" href="https://cinesembajadores.es/pelicula/harakiri-me-haces-falta/?ciudad=madrid">Toca aquí si no avanza</a></p>
<script>
(function(){
  // Destino de venta. Cambiar aquí para la próxima sala/función.
  // Hasta el 4 de octubre: entradas de Embajadores. Desde el 5: la película en Filmin.
  var FIN_FUNCION = new Date('2026-10-05T03:00:00+02:00');
  var antes = new Date() < FIN_FUNCION;
  var DESTINO = antes ? 'https://cinesembajadores.es/pelicula/harakiri-me-haces-falta/?ciudad=madrid'
                      : 'https://www.filmin.es/pelicula/harakiri-me-haces-falta';
  var CAMPANA = antes ? 'embajadores' : 'filmin';
  // Registro anónimo: formulario de Google "Harakiri · Escaneos QR posters"
  var FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSdaSMCu4kBQKcAMswLRxpMMvZa7XL0xBoUcG3i04GG90QF4tQ/formResponse';
  var CAMPO = 'entry.702382843';

  var q = new URLSearchParams(location.search);
  var p = (q.get('p') || 'sin-codigo').replace(/[^A-Za-z0-9_-]/g,'').slice(0,20) || 'sin-codigo';
  var ua = navigator.userAgent || '';
  var so = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'otro';
  var idioma = (navigator.language || '').slice(0,5);
  var zona = ''; try { zona = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
  var dato = [p, so, idioma, zona, CAMPANA].join(' | ');

  var cuerpo = new URLSearchParams();
  cuerpo.append(CAMPO, '__other_option__');
  cuerpo.append(CAMPO + '.other_option_response', dato);

  var ir = function(){
    var d = DESTINO + (DESTINO.indexOf('?') < 0 ? '?' : '&') +
      'utm_source=poster&utm_medium=qr&utm_campaign=' + CAMPANA + '&utm_content=' + encodeURIComponent(p);
    location.replace(d);
  };
  var hecho = false;
  var salir = function(){ if (!hecho) { hecho = true; ir(); } };
  try { fetch(FORM, {method:'POST', mode:'no-cors', body:cuerpo, keepalive:true}).then(salir, salir); } catch(e){ salir(); }
  setTimeout(salir, 1200);
})();
</script>
</body>
